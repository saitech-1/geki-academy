name: App checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_FIREBASE_API_KEY: ci-public-placeholder
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: demo-geki-academy
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: demo-geki-academy.firebaseapp.com
      NEXT_PUBLIC_FIREBASE_APP_ID: demo-geki-web
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
          cache: npm
      - name: Install locked dependencies, including build tools
        run: npm ci --include=dev
      - name: Verify types, unit tests and production build
        run: npm run build:verified

  integration:
    name: Auth, paid access and QR payment regression tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: geki
          POSTGRES_PASSWORD: geki_ci_only
          POSTGRES_DB: geki_ci
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U geki -d geki_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://geki:geki_ci_only@127.0.0.1:5433/geki_ci
      FIREBASE_PROJECT_ID: demo-geki-academy
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
      MEDIA_MODE: local
      UPLOAD_DIR: .local/ci-uploads
      HOST: 127.0.0.1
      PORT: "4000"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.20.0"
          cache: npm
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci --include=dev
      - run: npm run db:generate
      - name: Apply migrations and database security to disposable Postgres
        run: npm run db:migrate
      - name: Run authenticated API and payment tests against the emulator
        run: npx --no-install firebase emulators:exec --only auth --project demo-geki-academy "npm run test:ci"

  required:
    name: Release gate
    if: always()
    needs: [verify, integration]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every check to pass
        env:
          VERIFY_RESULT: ${{ needs.verify.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
        run: |
          test "$VERIFY_RESULT" = success
          test "$INTEGRATION_RESULT" = success
